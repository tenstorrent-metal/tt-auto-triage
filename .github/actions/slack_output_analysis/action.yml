name: sync-slack-errors-to-github
description: Sync Slack error messages to GitHub issues, with options to update or rebuild from scratch
inputs:
  github_token:
    description: GitHub Personal Access Token for creating/updating issues
    required: true
  slack_token:
    description: Slack Bot Token for fetching messages
    required: true
  channel_id:
    description: Slack channel ID to fetch messages from
    required: true
  update_mode:
    description: "Mode: 'update' to sync new errors, 'rebuild' to recreate all issues from scratch"
    required: false
    default: "update"
  run_maintenance:
    description: "Whether to run maintenance (cleanup old runs, ensure sorting)"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      shell: bash
      run: |
        pip install --upgrade pip
        pip install slack-sdk sentence-transformers scikit-learn rapidfuzz numpy requests
      working-directory: ${{ github.action_path }}

    - name: Create secrets.json
      shell: bash
      run: |
        set -euo pipefail
        cat > "${{ github.action_path }}/secrets.json" << EOF
        {
          "github_token": "${{ inputs.github_token }}",
          "github_repo_owner": "ebanerjeeTT",
          "github_repo_name": "tt-auto-triage",
          "slack_token": "${{ inputs.slack_token }}",
          "channel_id": "${{ inputs.channel_id }}",
          "project_owner": "",
          "project_name": "",
          "project_number": "",
          "project_field_id": ""
        }
        EOF
        echo "Created secrets.json with repo: ebanerjeeTT/tt-auto-triage"
      working-directory: ${{ github.action_path }}

    - name: Delete existing build_slack_export_with_threads.json if it exists
      shell: bash
      run: |
        set -euo pipefail
        if [ -f "${{ github.action_path }}/build_slack_export_with_threads.json" ]; then
          echo "Deleting existing build_slack_export_with_threads.json..."
          rm -f "${{ github.action_path }}/build_slack_export_with_threads.json"
        else
          echo "build_slack_export_with_threads.json does not exist, skipping deletion"
        fi
      working-directory: ${{ github.action_path }}

    - name: Fetch Slack messages and create build_slack_export_with_threads.json
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}"
        python3 get_and_analyze_slack.py
      env:
        PYTHONUNBUFFERED: 1

    - name: Extract errors from Slack export
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}"
        python3 extract_errors.py
      env:
        PYTHONUNBUFFERED: 1

    - name: Group similar errors
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}"
        python3 group_similar_errors.py
      env:
        PYTHONUNBUFFERED: 1

    - name: Rebuild issues from scratch
      if: inputs.update_mode == 'rebuild'
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}"
        python3 create_github_issues.py
      env:
        PYTHONUNBUFFERED: 1
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Update issues with new errors
      if: inputs.update_mode == 'update'
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}"
        python3 sync_new_errors.py
      env:
        PYTHONUNBUFFERED: 1
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Run maintenance on issues
      if: inputs.run_maintenance == 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}"
        python3 maintain_issues.py
      env:
        PYTHONUNBUFFERED: 1
        GITHUB_TOKEN: ${{ inputs.github_token }}
