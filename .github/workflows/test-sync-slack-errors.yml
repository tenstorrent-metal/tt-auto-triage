name: Test Sync Slack Errors to GitHub

on:
  workflow_dispatch:
    inputs:
      github_token:
        description: 'GitHub Personal Access Token for creating/updating issues'
        required: true
        type: string
      slack_token:
        description: 'Slack Bot Token for fetching messages'
        required: true
        type: string
      channel_id:
        description: 'Slack channel ID to fetch messages from'
        required: true
        type: string
      update_mode:
        description: 'Mode: update (sync new errors) or rebuild (recreate all issues)'
        required: false
        default: 'update'
        type: choice
        options:
          - update
          - rebuild
      run_maintenance:
        description: 'Run maintenance (cleanup old runs, ensure sorting)'
        required: false
        default: false
        type: boolean

jobs:
  sync-slack-errors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Slack errors to GitHub issues
        uses: ./.github/actions/slack_output_analysis
        with:
          github_token: ${{ inputs.github_token }}
          slack_token: ${{ inputs.slack_token }}
          channel_id: ${{ inputs.channel_id }}
          update_mode: ${{ inputs.update_mode || 'update' }}
          run_maintenance: ${{ inputs.run_maintenance || 'false' }}
